[package]
name = "quinn-btls"
version = "0.2.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/quinn-rs/quinn-boring"
description = "BoringSSL (btls) crypto provider for quinn"
keywords = ["quic"]
categories = ["network-programming", "asynchronous"]
edition = "2021"
rust-version = "1.70"

[badges]
maintenance = { status = "passively-maintained" }

[features]
default = ["runtime-tokio"]
fips = ["btls/fips", "btls-sys/fips"]
runtime-tokio = ["quinn/runtime-tokio"]

[dependencies]
btls = "0.5.6"
btls-sys = "0.5.6"
bytes = "1"
foreign-types-shared = "0.3"
lru = "0.12"
once_cell = "1"
quinn = { version = "0.11", default-features = false }
quinn-proto = { version = "0.11", default-features = false }
rand = "0.8"
tracing = "0.1"

[dev-dependencies]
anyhow = "1.0"
assert_matches = "1"
clap = { version = "4", features = ["derive"] }
directories-next = "2"
hex-literal = "0.4"
rcgen = "0.13"
rustls-pemfile = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros", "sync"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "time", "local-time"] }
url = "2"

[[example]]
name = "server"
required-features = ["runtime-tokio"]

[[example]]
name = "client"
required-features = ["runtime-tokio"]

# The btls fork whose mirrored ClientHello can offer values BoringSSL does not negotiate,
# failing a handshake whose server selects one with `SSL_R_OFFER_ONLY_VALUE_SELECTED`.
[patch.crates-io]
btls = { git = "https://github.com/shirshak55/btls", rev = "65bc6dad10da02637e5b553effd2d866c9cca311" }
btls-sys = { git = "https://github.com/shirshak55/btls", rev = "65bc6dad10da02637e5b553effd2d866c9cca311" }
# The quinn fork whose client sessions follow a server's compatible version negotiation
# (`crypto::Session::switch_version`, RFC 9368).
quinn = { git = "https://github.com/shirshak55/quinn", rev = "babb5b0b94e33c9b358ce93a3349f4e00b2f0ebd" }
quinn-proto = { git = "https://github.com/shirshak55/quinn", rev = "babb5b0b94e33c9b358ce93a3349f4e00b2f0ebd" }
quinn-udp = { git = "https://github.com/shirshak55/quinn", rev = "babb5b0b94e33c9b358ce93a3349f4e00b2f0ebd" }
